<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorros de Egresados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: columna única de hasta 900px, pestañas fijas arriba, tarjetas desplegables por pedido. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --mut:#5b6876; --line:#dde3e9;
  --accent:#0b6a8a; --accent-ink:#ffffff; --soft:#e2f0f5;
  --bad:#b42323; --bad-bg:#fde8e8; --ok:#17753f; --ok-bg:#dcf3e4;
  --btn2:#e3e8ed; --note-bg:#fff3cf; --note-tx:#7a5200; --field:#ffffff; --scrim:rgba(10,20,30,.45);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --surface:#17212d; --ink:#e8eef4; --mut:#93a1b0; --line:#263445;
    --accent:#4cb4d6; --accent-ink:#06222c; --soft:#16303c;
    --bad:#f08a8a; --bad-bg:#3a1d1f; --ok:#6fd39a; --ok-bg:#17301f;
    --btn2:#243242; --note-bg:#3a2f12; --note-tx:#f0cf80; --field:#101a25; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17212d; --ink:#e8eef4; --mut:#93a1b0; --line:#263445;
  --accent:#4cb4d6; --accent-ink:#06222c; --soft:#16303c;
  --bad:#f08a8a; --bad-bg:#3a1d1f; --ok:#6fd39a; --ok-bg:#17301f;
  --btn2:#243242; --note-bg:#3a2f12; --note-tx:#f0cf80; --field:#101a25; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-head);font-size:16px;margin:20px 0 8px;text-wrap:balance}
.demo{font-size:12px;background:var(--note-bg);color:var(--note-tx);padding:6px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
nav{display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;overflow-x:auto;margin-bottom:12px}
nav button{flex:1;white-space:nowrap;padding:9px 12px;border:0;background:none;border-radius:7px;font:600 14px var(--f-body);color:var(--mut);cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;min-width:0}
summary::-webkit-details-marker{display:none}
summary>div{min-width:0}
small{display:block;color:var(--mut);font-size:12px}
.r{text-align:right}
.deb{color:var(--bad)!important;font-weight:600}.ok{color:var(--ok)!important;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi span{font-size:12px;color:var(--mut);display:block}
.kpi b{display:block;font:700 19px var(--f-head);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.big{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.big span{color:var(--accent-ink);opacity:.85}
button{font:inherit;cursor:pointer}
.pri,.sec,.dan{border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.pri{background:var(--accent);color:var(--accent-ink)}
.sec{background:var(--btn2);color:var(--ink)}
.dan{background:var(--bad-bg);color:var(--bad)}
.mini{border:0;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}
.mini.dan{background:var(--bad-bg);color:var(--bad)}
.mini.paid{background:var(--ok-bg);color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;align-items:stretch}
.bar>input,.bar>select{flex:1;min-width:130px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2>*{min-width:0}
dialog{border:0;border-radius:12px;padding:16px;width:min(520px,94vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.row>*{min-width:0}
.row input{width:104px;padding:5px 7px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--soft);color:var(--accent);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--mut);font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts select{flex:1;min-width:140px;width:auto}
.empty{text-align:center;color:var(--mut);padding:22px}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

[hidden]{display:none!important}
button.pill{border:0;cursor:pointer;font-family:var(--f-body);padding:3px 10px}
.pill.e0{background:var(--note-bg);color:var(--note-tx)}
.pill.e1{background:var(--soft);color:var(--accent)}
.pill.e2{background:var(--ok-bg);color:var(--ok)}
.seg{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--mut);font-weight:600}
.seg button.on{border-color:transparent}
.seg button.on.e0{background:var(--note-bg);color:var(--note-tx)}
.seg button.on.e1{background:var(--soft);color:var(--accent)}
.seg button.on.e2{background:var(--ok-bg);color:var(--ok)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:8px 0}
.chk input{width:auto}
</style>

<div class="wrap">
  <header>
    <h1>Gorros de egresados</h1>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const num = v => parseFloat(v) || 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);

/* ---------- Datos de ejemplo ---------- */
function seed(){ return {pedidos:[],gastos:[],tarifas:[]}; }
const KEY = "gorros_app_v1";
let S;
try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; }catch(e){ S = null; }
if(!S || !S.pedidos) S = seed();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
const store = {
  save(c,o){ const i = S[c].findIndex(x=>x.id===o.id); i<0 ? S[c].push(o) : (S[c][i]=o); persist(); },
  del(c,id){ S[c] = S[c].filter(x=>x.id!==id); persist(); }
};

/* ---------- Cálculos ---------- */
const gTotal = g => num(g.valor) * num(g.cantidad);
const gPorGorro = g => num(g.rinde) > 0 ? num(g.valor) / num(g.rinde) : 0;
const pTotal = p => num(p.cantidad) * num(p.precio);
const pSaldo = p => pTotal(p) - num(p.sena);
const moTotal = p => sum(p.mo||[], m=>num(m.monto));
const moPagado = p => sum((p.mo||[]).filter(m=>m.pagado), m=>num(m.monto));
const nombresDe = p => (p.nombres||"").split("\n").map(x=>x.trim()).filter(Boolean);

/* Gastos: generales (se reparten entre todos los gorros) o de pedidos puntuales */
const idsValidos = g => (g.pedidoIds||[]).filter(id => S.pedidos.some(p=>p.id===id));
const esEsp = g => g.alcance === "pedidos" && idsValidos(g).length > 0;
function gAsignado(g,p){
  if(!esEsp(g)) return 0;
  const ids = idsValidos(g); if(!ids.includes(p.id)) return 0;
  const tot = sum(S.pedidos.filter(x=>ids.includes(x.id)), x=>num(x.cantidad));
  return tot>0 ? gTotal(g)*num(p.cantidad)/tot : gTotal(g)/ids.length;
}
const gastoEspecificoDe = p => sum(S.gastos, g=>gAsignado(g,p));
function costoGeneralPorGorro(){
  const gen = sum(S.gastos.filter(g=>!esEsp(g)), gTotal);
  const gor = sum(S.pedidos, p=>num(p.cantidad));
  return gor ? gen/gor : 0;
}
const costoPedido = (p,mat) => mat*num(p.cantidad) + gastoEspecificoDe(p);

/* Estado del pedido */
const ESTADOS = ["Pendiente","En producción","Entregado"];
const estCls = e => "e" + Math.max(0, ESTADOS.indexOf(e||"Pendiente"));
function setEstado(id,e){ const p=S.pedidos.find(x=>x.id===id); if(p && (p.estado||"Pendiente")!==e) store.save("pedidos",{...p,estado:e}); }
function nextEstado(ev,id){
  ev.preventDefault(); ev.stopPropagation();
  const p=S.pedidos.find(x=>x.id===id); if(!p) return;
  setEstado(id, ESTADOS[(ESTADOS.indexOf(p.estado||"Pendiente")+1)%ESTADOS.length]);
}

function totales(){
  const ventas = sum(S.pedidos,pTotal), cobrado = sum(S.pedidos,p=>num(p.sena));
  const gastos = sum(S.gastos,gTotal), mo = sum(S.pedidos,moTotal), moPag = sum(S.pedidos,moPagado);
  return {ventas, cobrado, porCobrar:ventas-cobrado, gastos, mo, moPag, moPend:mo-moPag,
    ganancia: ventas-gastos-mo, enMano: cobrado-gastos-moPag, gorros: sum(S.pedidos,p=>num(p.cantidad))};
}

/* ---------- Navegación ---------- */
let tab = "resumen", q = "", fEstado = "";
const open = new Set();
const TABS = {resumen:"Resumen",pedidos:"Pedidos",gastos:"Gastos",mo:"Mano de obra"};
function go(t){ tab = t; render(); window.scrollTo(0,0); }
function render(){
  $("#tabs").innerHTML = Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("");
  $("#view").innerHTML = ({resumen:vResumen,pedidos:vPedidos,gastos:vGastos,mo:vMO})[tab]();
}

/* ---------- Modales ---------- */
function modal(title, body, onOk, okText="Guardar", validate){
  const d = $("#dlg");
  d.innerHTML = `<form id="f" method="dialog"><h3 style="margin:0 0 4px;font-family:var(--f-head)">${title}</h3>${body}
    <p id="merr" class="deb" style="font-size:13px;margin:10px 0 0"></p>
    <div class="btns"><button type="button" class="sec" onclick="$('#dlg').close()">Cancelar</button><button class="pri">${okText}</button></div></form>`;
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = $("#f"), data = Object.fromEntries(new FormData(f));
    const err = validate ? validate(data,f) : "";
    if(err){ $("#merr").textContent = err; return; }
    d.close(); onOk(data,f);
  };
  d.showModal();
}
function ask(text, fn){
  const d = $("#dlg");
  d.innerHTML = `<h3 style="margin:0 0 6px;font-family:var(--f-head)">${esc(text)}</h3>
    <div class="btns"><button class="sec" onclick="$('#dlg').close()">Cancelar</button><button class="dan" id="okb">Eliminar</button></div>`;
  $("#okb").onclick = () => { d.close(); fn(); };
  d.showModal();
}
const fld = (label,name,val="",type="text",extra="") =>
  `<label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${type==="number"?'step="any" min="0"':""} ${extra}>`;

/* ---------- RESUMEN ---------- */
function vResumen(){
  const T = totales();
  const mat = costoGeneralPorGorro();
  const ord = [...S.pedidos].sort((a,b)=>(a.creado||0)-(b.creado||0));
  let acum = 0;
  const filas = ord.map(p=>{
    const costo = costoPedido(p,mat);
    const g = pTotal(p) - moTotal(p) - costo; acum += g;
    return `<tr><td>${esc(p.escuela)}</td><td>${money(pTotal(p))}</td><td>${money(costo)}</td><td>${money(moTotal(p))}</td><td class="${g<0?'deb':''}">${money(g)}</td><td><b>${money(acum)}</b></td></tr>`;
  }).join("");
  const porCat = {};
  S.gastos.forEach(g=>{ const k=g.categoria||"Otro"; porCat[k]=(porCat[k]||0)+gTotal(g); });
  return `
  <div class="kpis">
    <div class="kpi big"><span>Ganancia proyectada</span><b>${money(T.ganancia)}</b></div>
    <div class="kpi"><span>Ganancia en mano (cobrado − pagado)</span><b class="${T.enMano<0?'deb':''}">${money(T.enMano)}</b></div>
    <div class="kpi"><span>Ventas totales</span><b>${money(T.ventas)}</b></div>
    <div class="kpi"><span>Cobrado (señas y pagos)</span><b>${money(T.cobrado)}</b></div>
    <div class="kpi"><span>Falta cobrar</span><b class="${T.porCobrar>0?'deb':''}">${money(T.porCobrar)}</b></div>
    <div class="kpi"><span>Gastos</span><b>${money(T.gastos)}</b></div>
    <div class="kpi"><span>Mano de obra total</span><b>${money(T.mo)}</b></div>
    <div class="kpi"><span>Mano de obra por pagar</span><b class="${T.moPend>0?'deb':''}">${money(T.moPend)}</b></div>
    <div class="kpi"><span>Gorros pedidos</span><b>${T.gorros}</b></div>
  </div>
  <h2>Ganancia por pedido, acumulada</h2>
  <div class="card">${ord.length?`<div class="tw"><table><tr><th>Escuela</th><th>Venta</th><th>Gastos</th><th>M. obra</th><th>Ganancia</th><th>Acumulado</th></tr>${filas}</table></div>
  <small style="margin-top:8px">Los gastos generales se reparten por cantidad de gorros (${money(mat)} por gorro). Los gastos de pedidos puntuales, como el estampado, van solo a los pedidos elegidos.</small>`:'<div class="empty">Todavía no hay pedidos.</div>'}</div>
  <h2>Gastos por categoría</h2>
  <div class="card">${Object.keys(porCat).length?Object.entries(porCat).map(([k,v],i)=>`<div class="row" ${i===0?'style="border-top:0"':""}><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(""):'<div class="empty">Sin gastos cargados.</div>'}</div>`;
}

/* ---------- PEDIDOS ---------- */
function filtrados(){
  return S.pedidos
    .filter(p => (!fEstado || p.estado===fEstado) && (!q || (p.escuela+" "+p.encargada).toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>(b.creado||0)-(a.creado||0));
}
function vPedidos(){
  return `<div class="bar">
    <input id="busca" placeholder="Buscar escuela o encargada" value="${esc(q)}" oninput="q=this.value;renderLista()">
    <select id="festado" onchange="fEstado=this.value;renderLista()">
      <option value="">Todos</option>${["Pendiente","En producción","Entregado"].map(e=>`<option ${fEstado===e?"selected":""}>${e}</option>`).join("")}
    </select>
    <button class="pri" onclick="editPedido()">Nuevo pedido</button></div>
    <div id="lista">${listaHtml(filtrados())}</div>`;
}
function renderLista(){ $("#lista").innerHTML = listaHtml(filtrados()); }
const listaHtml = l => l.length ? l.map(pedidoCard).join("") : '<div class="empty">No hay pedidos con ese filtro.</div>';
function tg(id,o){ o?open.add(id):open.delete(id); }

function pedidoCard(p){
  const t = pTotal(p), s = pSaldo(p), nm = nombresDe(p);
  const wa = String(p.whatsapp||"").replace(/\D/g,"");
  const est = p.estado || "Pendiente";
  const mat = costoGeneralPorGorro();
  const gs = S.gastos.filter(g=>gAsignado(g,p)>0);
  const costo = costoPedido(p,mat);
  const gan = t - moTotal(p) - costo;
  const mo = (p.mo||[]).map(m=>`
    <div class="row">
      <div style="flex:1"><b>${esc(m.persona)}</b><small>${esc(m.concepto)}</small></div>
      <input type="number" step="any" min="0" aria-label="Monto" value="${num(m.monto)}" onchange="moSet('${p.id}','${m.id}',this.value)">
      <button class="mini ${m.pagado?'paid':'dan'}" onclick="moPaid('${p.id}','${m.id}')">${m.pagado?'Pagado':'Sin pagar'}</button>
      <button class="mini dan" aria-label="Quitar" onclick="moDel('${p.id}','${m.id}')">✕</button>
    </div>`).join("");
  const opts = S.tarifas.map(x=>`<option value="${x.id}">${esc(x.persona)} – ${esc(x.concepto)}</option>`).join("");
  const pend = moTotal(p)-moPagado(p);
  return `<details class="card" ${open.has(p.id)?"open":""} ontoggle="tg('${p.id}',this.open)">
    <summary>
      <div><b>${esc(p.escuela)}</b><small>${esc(p.encargada)} · ${num(p.cantidad)} gorros · <button type="button" class="pill ${estCls(est)}" title="Tocá para cambiar el estado" onclick="nextEstado(event,'${p.id}')">${esc(est)} ↻</button></small></div>
      <div class="r"><b>${money(t)}</b><small class="${s>0?'deb':'ok'}">${s>0?'Falta '+money(s):'Saldado'}</small></div>
    </summary>
    <div style="margin-top:10px">
      <small>Estado del pedido</small>
      <div class="seg" style="margin-top:4px">${ESTADOS.map(e=>`<button type="button" class="${est===e?'on '+estCls(e):''}" onclick="setEstado('${p.id}','${e}')">${e}</button>`).join("")}</div>
      <div class="g2" style="margin-top:12px"><small>Valor por gorro<br><b style="color:var(--ink);font-size:14px">${money(num(p.precio))}</b></small><small>Seña<br><b style="color:var(--ink);font-size:14px">${money(num(p.sena))}</b></small>
      <small>Entrega<br><b style="color:var(--ink);font-size:14px">${esc(p.entrega||"—")}</b></small><small>WhatsApp<br><b style="font-size:14px">${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(p.whatsapp)}</a>`:"—"}</b></small></div>
      ${p.notas?`<small style="margin-top:8px">Notas: ${esc(p.notas)}</small>`:""}
      <h2>Lista de nombres (${nm.length}${nm.length&&nm.length!==num(p.cantidad)?` de ${num(p.cantidad)}`:""})</h2>
      ${nm.length?`<ol style="margin:0;padding-left:22px;font-size:14px;columns:2;column-gap:20px">${nm.map(n=>`<li>${esc(n)}</li>`).join("")}</ol>`:'<small>Sin nombres cargados. Se agregan desde Editar.</small>'}
      <h2>Gastos de este pedido</h2>
      <div class="row" style="border-top:0"><span>Materiales generales<small>${money(mat)} por gorro × ${num(p.cantidad)}</small></span><b>${money(mat*num(p.cantidad))}</b></div>
      ${gs.map(g=>`<div class="row"><span>${esc(g.descripcion)}<small>${esc(g.categoria)} · solo pedidos puntuales</small></span><b>${money(gAsignado(g,p))}</b></div>`).join("")}
      <div class="acts"><button class="mini" onclick="editGasto(null,'${p.id}')">Agregar gasto a este pedido</button></div>
      <h2>Mano de obra de este pedido</h2>
      ${mo||'<small>Sin mano de obra cargada.</small>'}
      <div class="row"><b>Total mano de obra</b><b>${money(moTotal(p))}</b></div>
      <div class="row"><span>Pendiente de liquidar</span><b class="${pend>0?'deb':'ok'}">${money(pend)}</b></div>
      <div class="acts">
        ${S.tarifas.length?`<select id="tf${p.id}" aria-label="Tarifa">${opts}</select><button class="mini" onclick="moAdd('${p.id}',$('#tf${p.id}').value)">Agregar tarifa</button>`:""}
        <button class="mini" onclick="moManual('${p.id}')">Mano de obra manual</button>
      </div>
      <div class="row" style="margin-top:12px"><b>Ganancia estimada del pedido</b><b class="${gan<0?'deb':'ok'}">${money(gan)}</b></div>
      <small>Venta ${money(t)} − gastos ${money(costo)} − mano de obra ${money(moTotal(p))}</small>
      <div class="acts" style="margin-top:14px">
        <button class="sec" onclick="editPedido('${p.id}')">Editar</button>
        ${s>0?`<button class="pri" onclick="saldar('${p.id}')">Marcar saldado</button>`:""}
        <button class="dan" onclick="delPedido('${p.id}')">Eliminar</button>
      </div>
    </div></details>`;
}

function editPedido(id){
  const old = S.pedidos.find(p=>p.id===id);
  const p = old || {escuela:"",encargada:"",whatsapp:"",cantidad:"",precio:"",sena:"",entrega:"",estado:"Pendiente",nombres:"",notas:""};
  modal(old?"Editar pedido":"Nuevo pedido",
    fld("Escuela","escuela",p.escuela,"text","required")+fld("Encargada","encargada",p.encargada)+fld("WhatsApp (con código de área)","whatsapp",p.whatsapp,"tel")+
    `<div class="g2"><div>${fld("Cantidad de gorros","cantidad",p.cantidad,"number",'required oninput="calcP()"')}</div><div>${fld("Valor de venta por gorro","precio",p.precio,"number",'required oninput="calcP()"')}</div></div>
     <div class="g2"><div>${fld("Seña","sena",p.sena,"number",'oninput="calcP()"')}</div><div>${fld("Fecha de entrega","entrega",p.entrega,"date")}</div></div>
     <div class="card" style="margin:12px 0 0;background:var(--bg)"><div class="row" style="border:0"><span>Total del pedido</span><b id="cT">$ 0</b></div><div class="row"><span>Falta pagar</span><b id="cS">$ 0</b></div></div>
     <label>Estado</label><select name="estado">${["Pendiente","En producción","Entregado"].map(e=>`<option ${p.estado===e?"selected":""}>${e}</option>`).join("")}</select>
     <label>Lista de nombres (uno por línea)</label><textarea name="nombres" rows="6">${esc(p.nombres)}</textarea>
     <label>Notas</label><textarea name="notas" rows="2">${esc(p.notas)}</textarea>`,
    d => {
      const nuevo = {...(old||{id:uid(),creado:Date.now(),mo:[]}), ...d, cantidad:num(d.cantidad), precio:num(d.precio), sena:num(d.sena)};
      if(!old){
        nuevo.mo = S.tarifas.filter(t=>t.auto).map(t=>moDesdeTarifa(t,nuevo));
      } else if(num(old.cantidad)!==nuevo.cantidad){
        nuevo.mo = (old.mo||[]).map(m=>{
          const t = S.tarifas.find(x=>x.id===m.tarifaId);
          return (!m.pagado && t && t.modalidad==="por_gorro") ? {...m, monto: num(t.tarifa)*nuevo.cantidad} : m;
        });
      }
      open.add(nuevo.id);
      store.save("pedidos", nuevo);
    });
  calcP();
}
function calcP(){
  const f = $("#f"); if(!f||!$("#cT")) return;
  const t = num(f.cantidad.value)*num(f.precio.value);
  $("#cT").textContent = money(t); $("#cS").textContent = money(t-num(f.sena.value));
}
function saldar(id){ const p=S.pedidos.find(x=>x.id===id); store.save("pedidos",{...p,sena:pTotal(p)}); }
function delPedido(id){ ask("¿Eliminar este pedido?", ()=>store.del("pedidos",id)); }

/* Mano de obra dentro del pedido */
function moDesdeTarifa(t,p){
  return {id:uid(), tarifaId:t.id, persona:t.persona, concepto:t.concepto,
    monto: t.modalidad==="por_gorro" ? num(t.tarifa)*num(p.cantidad) : num(t.tarifa), pagado:false};
}
function moAdd(pid,tid){ const p=S.pedidos.find(x=>x.id===pid), t=S.tarifas.find(x=>x.id===tid); if(!t) return;
  store.save("pedidos",{...p,mo:[...(p.mo||[]),moDesdeTarifa(t,p)]}); }
function moManual(pid){
  const p = S.pedidos.find(x=>x.id===pid);
  modal("Mano de obra manual", fld("Persona","persona","","text","required")+fld("Concepto","concepto")+fld("Monto","monto","","number","required"),
    d=>store.save("pedidos",{...p,mo:[...(p.mo||[]),{id:uid(),persona:d.persona,concepto:d.concepto,monto:num(d.monto),pagado:false}]}));
}
function moUpd(pid,mid,fn){ const p=S.pedidos.find(x=>x.id===pid); store.save("pedidos",{...p,mo:(p.mo||[]).map(m=>m.id===mid?fn(m):m)}); }
function moSet(pid,mid,v){ moUpd(pid,mid,m=>({...m,monto:num(v)})); }
function moPaid(pid,mid){ moUpd(pid,mid,m=>({...m,pagado:!m.pagado})); }
function moDel(pid,mid){ const p=S.pedidos.find(x=>x.id===pid); store.save("pedidos",{...p,mo:(p.mo||[]).filter(m=>m.id!==mid)}); }

/* ---------- GASTOS ---------- */
const CATS = ["Tela","Entretela / cartón","Elástico","Hilo","Estampado / bordado","Borla / accesorios","Packaging","Envío","Otro"];
const UNIDADES = ["metro","unidad","kg","rollo","hora","servicio"];
function vGastos(){
  const l = [...S.gastos].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const aplica = g => esEsp(g)
    ? "Solo: " + idsValidos(g).map(id=>esc((S.pedidos.find(p=>p.id===id)||{}).escuela)).join(", ")
    : "Todos los pedidos";
  return `<div class="bar"><div class="kpi" style="flex:1"><span>Total gastado</span><b>${money(sum(S.gastos,gTotal))}</b></div>
    <button class="pri" onclick="editGasto()">Nuevo gasto</button></div>` +
    (l.length ? l.map(g=>`<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><b>${esc(g.descripcion)}</b><small>${esc(g.categoria)} · ${esc(g.fecha||"")}</small></div><b>${money(gTotal(g))}</b></div>
      <small style="margin-top:4px">${money(num(g.valor))} × ${num(g.cantidad)} ${esc(g.unidad||"")}${gPorGorro(g)?` · rinde ${num(g.rinde)} gorros por ${esc(g.unidad||"unidad")}: <b style="color:var(--ink)">${money(gPorGorro(g))} por gorro</b>`:""}</small>
      <small style="margin-top:4px"><span class="pill ${esEsp(g)?'e1':'e0'}">${aplica(g)}</span></small>
      <div class="acts"><button class="mini" onclick="editGasto('${g.id}')">Editar</button><button class="mini dan" onclick="delGasto('${g.id}')">Eliminar</button></div></div>`).join("")
      : '<div class="empty">Todavía no cargaste gastos. Ejemplo: tela, precio por metro, metros comprados.</div>');
}
function editGasto(id, pedidoId){
  const old = S.gastos.find(g=>g.id===id);
  const ped = pedidoId ? S.pedidos.find(p=>p.id===pedidoId) : null;
  const g = old || {fecha:new Date().toISOString().slice(0,10),descripcion:ped?"Estampado":"",categoria:ped?"Estampado / bordado":"Tela",
    valor:"",cantidad:ped?num(ped.cantidad):"",unidad:ped?"gorro":"metro",rinde:"",alcance:ped?"pedidos":"todos",pedidoIds:ped?[ped.id]:[]};
  const sel = g.pedidoIds||[];
  const lista = S.pedidos.length
    ? S.pedidos.map(p=>`<label class="chk"><input type="checkbox" name="pid" value="${p.id}" ${sel.includes(p.id)?"checked":""}><span>${esc(p.escuela)} · ${num(p.cantidad)} gorros</span></label>`).join("")
    : '<small>Todavía no hay pedidos cargados.</small>';
  modal(old?"Editar gasto":"Nuevo gasto",
    fld("Descripción (ej: tela raso negro)","descripcion",g.descripcion,"text","required")+
    `<label>Categoría</label><input name="categoria" list="cats" value="${esc(g.categoria)}" oninput="catAlc()"><datalist id="cats">${CATS.map(c=>`<option>${c}</option>`).join("")}</datalist>`+
    fld("Fecha","fecha",g.fecha,"date")+
    `<div class="g2"><div>${fld("Valor por metro / unidad","valor",g.valor,"number",'required oninput="calcG()"')}</div><div>${fld("Cantidad","cantidad",g.cantidad,"number",'required oninput="calcG()"')}</div></div>
     <div class="g2"><div><label>Unidad</label><input name="unidad" list="uns" value="${esc(g.unidad)}"><datalist id="uns">${UNIDADES.map(c=>`<option>${c}</option>`).join("")}</datalist></div>
     <div>${fld("Rinde (gorros por unidad)","rinde",g.rinde,"number",'oninput="calcG()"')}</div></div>
     <label>Se aplica a</label>
     <select name="alcance" id="alc" onchange="togAlc()"><option value="todos" ${g.alcance!=="pedidos"?"selected":""}>Todos los pedidos (se reparte por gorro)</option><option value="pedidos" ${g.alcance==="pedidos"?"selected":""}>Solo pedidos puntuales</option></select>
     <div id="pids" ${g.alcance==="pedidos"?"":"hidden"} style="margin-top:6px">${lista}</div>
     <div class="card" style="margin:12px 0 0;background:var(--bg)"><div class="row" style="border:0"><span>Total del gasto</span><b id="gT">$ 0</b></div><div class="row"><span>Costo por gorro</span><b id="gU">—</b></div></div>`,
    (d,f) => {
      const ids = d.alcance==="pedidos" ? [...f.querySelectorAll('input[name=pid]:checked')].map(x=>x.value) : [];
      store.save("gastos",{...(old||{id:uid()}),descripcion:d.descripcion,categoria:d.categoria,fecha:d.fecha,unidad:d.unidad,
        valor:num(d.valor),cantidad:num(d.cantidad),rinde:num(d.rinde),alcance:d.alcance,pedidoIds:ids});
    }, "Guardar",
    (d,f) => d.alcance==="pedidos" && !f.querySelector('input[name=pid]:checked') ? "Elegí al menos un pedido." : "");
  calcG();
}
function togAlc(){ $("#pids").hidden = $("#alc").value !== "pedidos"; }
function catAlc(){
  const f = $("#f"); if(!f) return;
  if(/estampad|bordad/i.test(f.categoria.value) && $("#alc").value === "todos"){ $("#alc").value = "pedidos"; togAlc(); }
}
function calcG(){
  const f=$("#f"); if(!f||!$("#gT")) return;
  $("#gT").textContent = money(num(f.valor.value)*num(f.cantidad.value));
  $("#gU").textContent = num(f.rinde.value)>0 ? money(num(f.valor.value)/num(f.rinde.value)) : "—";
}
function delGasto(id){ ask("¿Eliminar este gasto?", ()=>store.del("gastos",id)); }

/* ---------- MANO DE OBRA ---------- */
function vMO(){
  const T = totales();
  const pend = {};
  S.pedidos.forEach(p=>(p.mo||[]).filter(m=>!m.pagado).forEach(m=>{ (pend[m.persona]=pend[m.persona]||[]).push({p,m}); }));
  return `
  <div class="kpis"><div class="kpi"><span>Total mano de obra</span><b>${money(T.mo)}</b></div>
  <div class="kpi"><span>Pagado</span><b class="ok">${money(T.moPag)}</b></div>
  <div class="kpi"><span>Pendiente</span><b class="${T.moPend>0?'deb':''}">${money(T.moPend)}</b></div></div>
  <h2>A liquidar por persona</h2>
  ${Object.keys(pend).length ? Object.entries(pend).map(([n,arr])=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(n)}</b><b class="deb">${money(sum(arr,x=>num(x.m.monto)))}</b></div>
    ${arr.map(({p,m})=>`<div class="row"><span>${esc(p.escuela)}<small>${esc(m.concepto)}</small></span><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${money(num(m.monto))} <button class="mini" onclick="moPaid('${p.id}','${m.id}')">Marcar pagado</button></span></div>`).join("")}</div>`).join("")
    : '<div class="card empty">No hay mano de obra pendiente.</div>'}
  <div class="bar" style="margin-top:20px;align-items:center"><h2 style="flex:1;margin:0">Tarifas y conceptos</h2><button class="pri" onclick="editTarifa()">Nueva tarifa</button></div>
  ${S.tarifas.length ? S.tarifas.map(t=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><b>${esc(t.persona)}</b><small>${esc(t.concepto)} · ${t.modalidad==="por_gorro"?"por gorro":"fijo por pedido"}${t.auto?" · se agrega solo a cada pedido nuevo":""}</small></div><b>${money(num(t.tarifa))}</b></div>
    <div class="acts"><button class="mini" onclick="editTarifa('${t.id}')">Editar</button><button class="mini dan" onclick="delTarifa('${t.id}')">Eliminar</button></div></div>`).join("")
    : '<div class="empty">Cargá tarifas, por ejemplo costurera por gorro, para sumarlas rápido a cada pedido. También podés agregar mano de obra manual dentro de cada pedido.</div>'}`;
}
function editTarifa(id){
  const old = S.tarifas.find(t=>t.id===id);
  const t = old || {persona:"",concepto:"Confección",modalidad:"por_gorro",tarifa:"",auto:false};
  modal(old?"Editar tarifa":"Nueva tarifa",
    fld("Persona o proveedor","persona",t.persona,"text","required")+fld("Concepto (confección, corte, bordado, envío)","concepto",t.concepto)+
    `<label>Modalidad</label><select name="modalidad"><option value="por_gorro" ${t.modalidad==="por_gorro"?"selected":""}>Por gorro (tarifa × cantidad)</option><option value="fijo" ${t.modalidad==="fijo"?"selected":""}>Monto fijo por pedido</option></select>`+
    fld("Tarifa o monto","tarifa",t.tarifa,"number","required")+
    `<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink)"><input type="checkbox" name="auto" style="width:auto" ${t.auto?"checked":""}> Agregar a cada pedido nuevo automáticamente</label>`,
    d => store.save("tarifas",{...(old||{id:uid()}),persona:d.persona,concepto:d.concepto,modalidad:d.modalidad,tarifa:num(d.tarifa),auto:!!d.auto}));
}
function delTarifa(id){ ask("¿Eliminar esta tarifa? Lo ya cargado en pedidos no cambia.", ()=>store.del("tarifas",id)); }

render();
</script>
